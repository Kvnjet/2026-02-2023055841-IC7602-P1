services:
  dns-api:
    image: ic7602-dns-api:local
    build:
      context: .
    env_file:
      - .env
    ports:
      - "${DNS_API_PORT:-8080}:${DNS_API_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${DNS_API_PORT:-8080}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
