[package]
name = "DNS"
version = "0.1.0"
edition = "2021"

[dependencies]

pcap = "2.5.0"
ctrlc = "3.0"
dns-parser = "0.8"
clap = { version = "4.0", features = ["derive"] }
warp = { version = "0.4", features = ["server"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
base64 = "0.23.1"
warp-openssl = "0.6.1"
reqwest = { version = "0.13.5", features = ["json"] }